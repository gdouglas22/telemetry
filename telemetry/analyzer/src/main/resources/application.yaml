spring:
  application:
    name: analyzer
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/telemetry
    username: telemetry
    password: telemetry
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: always

grpc:
  client:
    hub-router:
      address: 'static://localhost:59090'
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext

analyzer:
  kafka:
    bootstrap-servers: localhost:9092
    poll-timeout-ms: 1000
    topics:
      hubs: telemetry.hubs.v1
      snapshots: telemetry.snapshots.v1
    hub-consumer:
      group-id: telemetry-analyzer-hub-events
      auto-offset-reset: earliest
    snapshot-consumer:
      group-id: telemetry-analyzer-snapshots
      auto-offset-reset: earliest
